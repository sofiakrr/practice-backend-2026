openapi: 3.0.3
info:
  title: Cafe Booking API
  version: 1.0.0
  description: |
    REST API for table/resources booking with JWT authentication,
    role-based access (user/admin), schedules, availability search, and reviews.
servers:
  - url: http://localhost:8000
    description: Local server
tags:
  - name: Auth
  - name: Resources
  - name: Bookings
  - name: Reviews
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      operationId: registerUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegisterResponse"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Login and get JWT token
      operationId: loginUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthTokenResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Logout current user
      operationId: logoutUser
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Logout successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get current user profile
      operationId: getMe
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

  /api/resources:
    get:
      tags: [Resources]
      summary: Get active resources list with filters and pagination
      operationId: listResources
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: capacity
          schema:
            type: integer
            minimum: 1
        - in: query
          name: max_price
          schema:
            type: number
            minimum: 0
        - in: query
          name: location
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [id, price_per_hour, capacity, reviews_avg_rating]
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Paginated resources list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResourcePaginator"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    post:
      tags: [Resources]
      summary: Create resource (admin only)
      operationId: createResource
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceCreateRequest"
      responses:
        "201":
          description: Resource created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/resources/available:
    get:
      tags: [Resources]
      summary: Search available resources for date/time slot
      operationId: listAvailableResources
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: start_time
          required: true
          schema:
            type: string
            pattern: "^([01]\\d|2[0-3]):([0-5]\\d)$"
        - in: query
          name: end_time
          required: true
          schema:
            type: string
            pattern: "^([01]\\d|2[0-3]):([0-5]\\d)$"
        - in: query
          name: capacity
          schema:
            type: integer
            minimum: 1
        - in: query
          name: type
          schema:
            type: string
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [id, price_per_hour, capacity, reviews_avg_rating]
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Available resources for requested slot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailableResourcesResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/resources/{resource}:
    get:
      tags: [Resources]
      summary: Get one resource by id
      operationId: getResource
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Resource details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    put:
      tags: [Resources]
      summary: Update resource (admin only)
      operationId: updateResource
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResourceUpdateRequest"
      responses:
        "200":
          description: Updated resource
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Resource"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

    delete:
      tags: [Resources]
      summary: Delete resource (admin only)
      operationId: deleteResource
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      responses:
        "200":
          description: Resource deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"

  /api/resources/{resource}/schedule:
    get:
      tags: [Resources]
      summary: Get resource schedule by day or week
      operationId: getResourceSchedule
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - in: query
          name: date
          required: true
          schema:
            type: string
            format: date
        - in: query
          name: mode
          schema:
            type: string
            enum: [day, week]
            default: day
      responses:
        "200":
          description: Schedule result
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/DayScheduleResponse"
                  - $ref: "#/components/schemas/WeekScheduleResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/ValidationError"

  /api/resources/{resource}/reviews:
    get:
      tags: [Reviews]
      summary: List reviews for resource with average rating
      operationId: listReviews
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: rating
          schema:
            type: integer
            minimum: 1
            maximum: 5
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [created_at, rating]
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
      responses:
        "200":
          description: Reviews list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReviewListResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "404":
          $ref: "#/components/responses/NotFoundError"

    post:
      tags: [Reviews]
      summary: Create review for finished booking
      operationId: createReview
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ResourceId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewCreateRequest"
      responses:
        "201":
          description: Review created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          description: Validation/business rule error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/MessageResponse"

  /api/bookings:
    get:
      tags: [Bookings]
      summary: List bookings (admin gets all, user gets own)
      operationId: listBookings
      security:
        - bearerAuth: []
      parameters:
        - in: query
          name: status
          schema:
            type: string
            enum: [active, cancelled]
        - in: query
          name: resource_id
          schema:
            type: integer
        - in: query
          name: user_id
          description: Admin only filter
          schema:
            type: integer
        - in: query
          name: date_from
          schema:
            type: string
            format: date
        - in: query
          name: date_to
          schema:
            type: string
            format: date
        - in: query
          name: sort_by
          schema:
            type: string
            enum: [date, start_time, created_at]
        - in: query
          name: sort_order
          schema:
            type: string
            enum: [asc, desc]
        - in: query
          name: per_page
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: Bookings list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BookingPaginator"
        "401":
          $ref: "#/components/responses/UnauthorizedError"

    post:
      tags: [Bookings]
      summary: Create booking
      operationId: createBooking
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingCreateRequest"
      responses:
        "201":
          description: Booking created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "422":
          description: Validation/business rule error
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/ValidationErrorResponse"
                  - $ref: "#/components/schemas/MessageResponse"

  /api/bookings/{id}:
    delete:
      tags: [Bookings]
      summary: Cancel booking
      operationId: cancelBooking
      security:
        - bearerAuth: []
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Booking cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          $ref: "#/components/responses/UnauthorizedError"
        "403":
          $ref: "#/components/responses/ForbiddenError"
        "404":
          $ref: "#/components/responses/NotFoundError"
        "422":
          $ref: "#/components/responses/MessageOnlyError"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      in: path
      name: resource
      required: true
      schema:
        type: integer

  responses:
    UnauthorizedError:
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"
          examples:
            noToken:
              value:
                message: Unauthenticated.

    ForbiddenError:
      description: Access denied for current role or object owner rules
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"

    NotFoundError:
      description: Entity not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"

    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"

    MessageOnlyError:
      description: Business rule error with message only
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MessageResponse"

  schemas:
    RegisterRequest:
      type: object
      required: [name, email, password]
      properties:
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 6

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string

    RegisterResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/User"

    AuthTokenResponse:
      type: object
      properties:
        token:
          type: string

    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required: [message]

    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: The given data was invalid.
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
      required: [message, errors]

    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, user]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Resource:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
        capacity:
          type: integer
        location:
          type: string
        price_per_hour:
          type: number
          format: float
        is_active:
          type: boolean
        reviews_count:
          type: integer
          nullable: true
        reviews_avg_rating:
          type: number
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ResourceCreateRequest:
      type: object
      required: [name, type, capacity, location, price_per_hour]
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
        capacity:
          type: integer
          minimum: 1
        location:
          type: string
        price_per_hour:
          type: number
          minimum: 0

    ResourceUpdateRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
          nullable: true
        type:
          type: string
        capacity:
          type: integer
          minimum: 1
        location:
          type: string
        price_per_hour:
          type: number
          minimum: 0
        is_active:
          type: boolean

    ResourcePaginator:
      type: object
      properties:
        current_page:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/Resource"
        first_page_url:
          type: string
          nullable: true
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
              label:
                type: string
              active:
                type: boolean
        next_page_url:
          type: string
          nullable: true
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
        total:
          type: integer

    AvailableResourcesResponse:
      type: object
      properties:
        date:
          type: string
          format: date
        start_time:
          type: string
        end_time:
          type: string
        available:
          $ref: "#/components/schemas/ResourcePaginator"
      required: [date, start_time, end_time, available]

    Booking:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        resource_id:
          type: integer
        date:
          type: string
          format: date
        start_time:
          type: string
        end_time:
          type: string
        status:
          type: string
          enum: [active, cancelled]
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        resource:
          $ref: "#/components/schemas/Resource"
        user:
          $ref: "#/components/schemas/User"

    BookingPaginator:
      type: object
      properties:
        current_page:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/Booking"
        first_page_url:
          type: string
          nullable: true
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
              label:
                type: string
              active:
                type: boolean
        next_page_url:
          type: string
          nullable: true
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
        total:
          type: integer

    BookingCreateRequest:
      type: object
      required: [resource_id, date, start_time, end_time]
      properties:
        resource_id:
          type: integer
        date:
          type: string
          format: date
        start_time:
          type: string
          pattern: "^([01]\\d|2[0-3]):([0-5]\\d)$"
        end_time:
          type: string
          pattern: "^([01]\\d|2[0-3]):([0-5]\\d)$"

    ScheduleBooking:
      type: object
      properties:
        id:
          type: integer
        date:
          type: string
          format: date
        start_time:
          type: string
        end_time:
          type: string
        status:
          type: string

    DayScheduleResponse:
      type: object
      properties:
        resource:
          type: string
        mode:
          type: string
          enum: [day]
        date:
          type: string
          format: date
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleBooking"

    WeekScheduleResponse:
      type: object
      properties:
        resource:
          type: string
        mode:
          type: string
          enum: [week]
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        bookings:
          type: array
          items:
            $ref: "#/components/schemas/ScheduleBooking"

    Review:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        booking_id:
          type: integer
        resource_id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        user:
          type: object
          properties:
            id:
              type: integer
            name:
              type: string

    ReviewCreateRequest:
      type: object
      required: [booking_id, rating]
      properties:
        booking_id:
          type: integer
        rating:
          type: integer
          minimum: 1
          maximum: 5
        comment:
          type: string
          maxLength: 1000
          nullable: true

    ReviewPaginator:
      type: object
      properties:
        current_page:
          type: integer
        data:
          type: array
          items:
            $ref: "#/components/schemas/Review"
        first_page_url:
          type: string
          nullable: true
        from:
          type: integer
          nullable: true
        last_page:
          type: integer
        last_page_url:
          type: string
        links:
          type: array
          items:
            type: object
            properties:
              url:
                type: string
                nullable: true
              label:
                type: string
              active:
                type: boolean
        next_page_url:
          type: string
          nullable: true
        path:
          type: string
        per_page:
          type: integer
        prev_page_url:
          type: string
          nullable: true
        to:
          type: integer
          nullable: true
        total:
          type: integer

    ReviewListResponse:
      type: object
      properties:
        resource:
          type: string
        average_rating:
          type: number
          nullable: true
        reviews:
          $ref: "#/components/schemas/ReviewPaginator"
